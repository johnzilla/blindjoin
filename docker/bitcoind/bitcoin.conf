# Bitcoin Core signet configuration for blindjoin Docker Compose stack.
# Mounted at /home/bitcoin/.bitcoin/bitcoin.conf in the bitcoind container.

# Network selection
signet=1
server=1

# RPC server (accepts connections from Docker bridge network)
rpcuser=blindjoin
rpcpassword=blindjoin
rpcallowip=0.0.0.0/0
rpcbind=0.0.0.0
rpcport=38332

# Peer connectivity
listen=1

# txindex not required for blindjoin (coordinator uses gettxout, not rawtransaction index)
txindex=0

# Data directory (Docker named volume mounted here)
datadir=/home/bitcoin/.bitcoin
