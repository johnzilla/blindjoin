# Bitcoin Core signet configuration for blindjoin Docker Compose stack.
# Mounted at /home/bitcoin/.bitcoin/bitcoin.conf in the bitcoind container.

# Network selection
signet=1
server=1

# RPC server. B2: scope RPC access to loopback (the in-container healthcheck uses
# -rpcconnect=127.0.0.1) and the Docker private address range (the coordinator
# reaches bitcoind over the compose network) — NOT 0.0.0.0/0. Combined with binding
# the published host port to 127.0.0.1 (see docker-compose.yml), the RPC is no longer
# reachable from the open internet with the well-known dev credentials below.
#
# NOTE: `blindjoin`/`blindjoin` are DEV-ONLY credentials for a local signet stack
# (worthless coins). Change them (and keep this scoping) for any deployment reachable
# beyond localhost.
rpcuser=blindjoin
rpcpassword=blindjoin
rpcallowip=127.0.0.1
rpcallowip=172.16.0.0/12
rpcbind=0.0.0.0
rpcport=38332

# Peer connectivity
listen=1

# txindex not required for blindjoin (coordinator uses gettxout, not rawtransaction index)
txindex=0

# Data directory (Docker named volume mounted here)
datadir=/home/bitcoin/.bitcoin
