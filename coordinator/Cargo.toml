[package]
name = "coordinator"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "coordinator"
path = "src/main.rs"

[lib]
name = "coordinator"
path = "src/lib.rs"

[dependencies]
shared = { path = "../shared" }
blind-rsa-signatures = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }
hmac = { workspace = true }
bitcoin = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
corepc-types = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = "0.8"
subtle = "2"
config = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { version = "0.6", features = ["limit", "timeout"] }
# Phase 8 WR-03: drop `tonic` from tower_governor's default feature set —
# the coordinator never instantiates gRPC, and pulling tonic transitively
# inflates binary size and CVE surface for no benefit. The `tracing`
# feature stays OFF: enabling it would emit per-request log lines from
# tower_governor's namespace at info level (per-429 audit not done).
# Bump in lockstep with `governor = "0.10"` below — see IN-02.
tower_governor = { version = "0.8", default-features = false, features = ["axum"] }
# Direct dep on governor so middleware.rs can name `NoOpMiddleware` / `QuantaInstant`
# as type parameters in `RateLimitLayers` struct fields. This is already a transitive
# dep of tower_governor 0.8 (which re-exports `governor::*` only via crate path,
# not as `pub use`); pinning the same minor version keeps the dep graph flat.
governor = "0.10"
http = "1"
base64 = "0.22"
anyhow = { workspace = true }
pkarr = { workspace = true }
arti-client = { version = "0.41", default-features = false, features = ["onion-service-service", "tokio", "rustls", "compression"] }
tor-hsservice = "0.41"
tor-cell = { version = "0.41", features = ["hs"] }
safelog = "0.8"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
futures-util = "0.3"

[dev-dependencies]
# Note: corepc-node defaults to Bitcoin Core 0.17.2 RPC schema (from 2018) —
# we explicitly enable the 30_2 feature so the test harness uses modern
# Bitcoin Core RPC types compatible with v30+ daemons (incl. v31 from brew).
corepc-node = { version = "0.12", features = ["30_2"] }
client = { path = "../client" }
shared = { path = "../shared" }
# Phase 18 18-02: bot_rotation.rs integration test drives liquidity_bot::run via [lib] target.
liquidity-bot = { path = "../liquidity-bot" }
reqwest = { workspace = true }
tempfile = "3"

[features]
default = []
# opt-in gate for the v1.3-client ↔ v1.4-coordinator binary compatibility test
# (tests/integration/v13_binary_compat.rs). Disabled by default because the
# first-run cost is ~30-45s (cold cargo build of the pinned v1.3 worktree) and
# ~600MB disk. Enable with: cargo test --features v13-binary-compat --test integration v13_binary_compat
v13-binary-compat = []

[[test]]
name = "integration"
path = "../tests/integration/mod.rs"
