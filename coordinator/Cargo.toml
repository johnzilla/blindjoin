[package]
name = "coordinator"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "coordinator"
path = "src/main.rs"

[lib]
name = "coordinator"
path = "src/lib.rs"

[dependencies]
shared = { path = "../shared" }
blind-rsa-signatures = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }
hmac = { workspace = true }
bitcoin = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
corepc-types = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = "0.8"
subtle = "2"
config = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { version = "0.6", features = ["limit", "timeout"] }
tower_governor = "0.8"
# Direct dep on governor so middleware.rs can name `NoOpMiddleware` / `QuantaInstant`
# as type parameters in `RateLimitLayers` struct fields. This is already a transitive
# dep of tower_governor 0.8 (which re-exports `governor::*` only via crate path,
# not as `pub use`); pinning the same minor version keeps the dep graph flat.
governor = "0.10"
http = "1"
base64 = "0.22"
anyhow = { workspace = true }
pkarr = { workspace = true }
arti-client = { version = "0.41", default-features = false, features = ["onion-service-service", "tokio", "rustls", "compression"] }
tor-hsservice = "0.41"
tor-cell = { version = "0.41", features = ["hs"] }
safelog = "0.8"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
futures-util = "0.3"

[dev-dependencies]
corepc-node = "0.10"
client = { path = "../client" }
shared = { path = "../shared" }
reqwest = { workspace = true }
tempfile = "3"

[[test]]
name = "integration"
path = "../tests/integration/mod.rs"
