[package]
name = "shared"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
bitcoin = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
hex = "0.4"
base64 = "0.22"
# v1.4 Phase 15 Plan 15-02 adds bip322 as the BIP-322 multi-script verify
# adapter (Sprint-0-A:145-175, ADR Decision #1). The EXACT-equals pin is a
# Phase 14 carry-forward constraint #3 invariant; bip322 is pre-1.0 and minor
# version bumps can break the 26-LOC adapter at shared/src/bip322/mod.rs.
# A CI grep gate (.github/workflows/ci.yml::bip322-pin-check) enforces the
# pin on every PR.
#
# 0.0.11 (2026-08) binds the witness pubkey to the challenged address before
# signature verification (fix commit e8accbe) — the soundness fix for the same
# gap our key-binding guard closes. Versions 0.0.6–0.0.10 were YANKED from
# crates.io, so this pin MUST move off 0.0.10. We keep the local guard as
# defense-in-depth per the comment at shared/src/bip322/mod.rs.
bip322 = "=0.0.11"
thiserror = { workspace = true }

[dev-dependencies]
# v1.4 Phase 15 Plan 15-03 adds proptest as the property-test scaffolding for
# the BIP-322 per-script vector tests (BIP322-04) + future cross-impl
# differential fixtures (TEST-EXT-01 v1.5 candidate). Workspace pins
# `proptest = "1"` at root Cargo.toml:28; this declaration re-exports per
# Phase 14 carry-forward constraint #3 + Shared Pattern 4.
proptest = { workspace = true }
