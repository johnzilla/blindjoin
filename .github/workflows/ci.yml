name: CI

# TODO: bump actions/checkout v4.3.1 → v6.x once Node 20 is hard-cut off. v4→v6
# is a major bump; verify defaults haven't shifted before pinning a new SHA.

env:
  # Run Node 20 JS actions on Node 24 to silence the deprecation warning.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Integration tests panic instead of skip when bitcoind is missing.
  BLINDJOIN_REQUIRE_BITCOIND: "1"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # bitcoind version pin lives at .bitcoind-version (single source of truth).
      - name: Read pinned bitcoind version
        id: bitcoind_version
        run: echo "version=$(cat .bitcoind-version)" >> $GITHUB_OUTPUT

      - name: Cache bitcoind binary
        id: cache-bitcoind
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/bin/bitcoind
          # runner.os prefix avoids cross-OS collisions; version segment forces a
          # cache miss on every .bitcoind-version bump so PGP+SHA256 re-verify.
          key: ${{ runner.os }}-bitcoind-${{ steps.bitcoind_version.outputs.version }}

      - name: Install bitcoind (cache miss only)
        if: steps.cache-bitcoind.outputs.cache-hit != 'true'
        # Integrity gate:
        #   1. Fetch achow101's PGP key from a SHA-pinned guix.sigs commit.
        #   2. Verify the imported key fingerprint equals KEY_FP.
        #   3. gpg-verify SHA256SUMS.asc against SHA256SUMS (signed by achow101).
        #   4. hash-check the tarball against the signed SHA256SUMS entry.
        # KEY_FP = achow101's Bitcoin Core release-signer fingerprint.
        # guix.sigs commit pinned to bitcoin-core/guix.sigs main HEAD at the time
        # of pin; bumps need PR review (both key blob and KEY_FP could be swapped
        # together by a compromised guix.sigs HEAD).
        run: |
          set -euo pipefail
          VERSION="${{ steps.bitcoind_version.outputs.version }}"
          TARBALL="bitcoin-${VERSION}-x86_64-linux-gnu.tar.gz"
          BASE="https://bitcoincore.org/bin/bitcoin-core-${VERSION}"
          KEY_FP=152812300785C96444D3334D17565732E08E5E41
          GUIX_SIGS_SHA=893b44f5fb1ed2abcdd79feb1c54723e3ccf5b59  # pinned 2026-05-26

          # 1. Fetch achow101's key blob from the pinned guix.sigs commit.
          curl -sL "https://raw.githubusercontent.com/bitcoin-core/guix.sigs/${GUIX_SIGS_SHA}/builder-keys/achow101.gpg" -o /tmp/achow101.gpg
          gpg --import /tmp/achow101.gpg

          # 2. Verify the imported key fingerprint matches expectation.
          gpg --list-keys --with-colons | grep -q "${KEY_FP}" \
            || { echo "ERROR: expected fingerprint ${KEY_FP} not found"; exit 1; }

          # 3. Verify achow101's signature on SHA256SUMS. SHA256SUMS.asc carries
          # ~10 builder sigs; we only need achow101's. Plain `gpg --verify` would
          # exit non-zero because gpg can't check the other ~9 keys we haven't
          # imported, which under `set -euo pipefail` would fail the script even
          # on a valid sig. Match the VALIDSIG line from --status-fd against KEY_FP
          # directly — the full 40-char fingerprint is unambiguous. Print status
          # output to the log so a future verify break is debuggable.
          curl -sL "${BASE}/SHA256SUMS" -o SHA256SUMS
          curl -sL "${BASE}/SHA256SUMS.asc" -o SHA256SUMS.asc
          gpg --status-fd=1 --verify SHA256SUMS.asc SHA256SUMS 2>/dev/null > /tmp/gpg-status.txt || true
          echo "=== gpg --status-fd=1 output ==="
          cat /tmp/gpg-status.txt
          echo "================================"
          grep -q "^\[GNUPG:\] VALIDSIG ${KEY_FP} " /tmp/gpg-status.txt \
            || { echo "ERROR: SHA256SUMS.asc does not have a VALIDSIG from achow101 fingerprint ${KEY_FP}"; exit 1; }

          # 4. Fetch tarball, verify hash against signed sums.
          curl -sL "${BASE}/${TARBALL}" -o "${TARBALL}"
          grep "  ${TARBALL}$" SHA256SUMS | sha256sum -c

          # 5. Extract and install into ~/.local/bin (cached path).
          tar -xzf "${TARBALL}"
          mkdir -p $HOME/.local/bin
          cp "bitcoin-${VERSION}/bin/bitcoind" $HOME/.local/bin/bitcoind
          chmod +x $HOME/.local/bin/bitcoind

      - name: Export BITCOIND_EXE
        # corepc_node::exe_path() reads BITCOIND_EXE as first precedence.
        run: echo "BITCOIND_EXE=$HOME/.local/bin/bitcoind" >> $GITHUB_ENV

      - name: Run tests
        run: cargo test --workspace --all-targets

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: "1.95.0"
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Run clippy
        # --all-targets includes integration tests, so future struct/API drift
        # that breaks tests/integration/ surfaces as a CI failure, not silent rot.
        run: cargo clippy --workspace --all-targets -- -D warnings

  coordinator-smoke:
    name: coordinator binary builds
    runs-on: ubuntu-latest
    # Catches missing-feature-flag / linker-flag regressions a debug
    # `cargo test` build wouldn't surface.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Build coordinator (release)
        run: cargo build --release --bin coordinator

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    # Blocks merge: cargo audit exits non-zero on any advisory not listed in
    # .cargo/audit.toml. Each ignore in audit.toml carries a written rationale.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: "1.95.0"
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run audit
        run: cargo audit

  corepc-node-feature-pin-check:
    name: corepc-node feature pin check
    runs-on: ubuntu-latest
    # Without an explicit `features = [...]` clause, corepc-node silently
    # defaults to Bitcoin Core 0.17.2 (2018) RPC schema. This gate catches
    # future declarations that forget it. Multi-line table form is a known
    # false positive — single-line the declaration or extend the regex.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Enforce explicit corepc-node feature
        run: |
          set -eu
          if grep -rEn 'corepc-node\s*=' --include='Cargo.toml' . \
             | grep -v 'features\s*=' \
             | grep -v '^[^:]*:[0-9]*:#'; then
            echo "ERROR: corepc-node declaration(s) above lack an explicit 'features = [...]' clause." >&2
            echo "       Without a version feature, corepc-node uses the Bitcoin Core 0.17.2 (2018) RPC schema." >&2
            echo "       Add 'features = [\"30_2\"]' (or whatever version pin is appropriate) to each declaration." >&2
            exit 1
          fi

  bip322-pin-check:
    name: bip322 exact-version pin check
    runs-on: ubuntu-latest
    # bip322 is pre-1.0; the API can break between patch releases. The adapter
    # at shared/src/bip322/mod.rs is verified against exactly =0.0.10 — any
    # drift needs the adapter re-verified by hand.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Enforce exact bip322 pin
        run: |
          set -eu
          if grep -rEn 'bip322\s*=' --include='Cargo.toml' . \
             | grep -v '=\s*"=0\.0\.10"' \
             | grep -v '^[^:]*:[0-9]*:#'; then
            echo "ERROR: bip322 declaration(s) above lack the exact-version pin '=0.0.10'." >&2
            echo "       The bip322 crate is pre-1.0; minor changes can break the adapter at shared/src/bip322/mod.rs." >&2
            exit 1
          fi

  sigstore-pin-check:
    name: sigstore + sbom action SHA-pin check
    runs-on: ubuntu-latest
    # Catches a floating tag (@v3, @main) on the sigstore/sbom actions, which
    # would let upstream silently substitute the action behind a tag move.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Enforce SHA pin on sigstore + sbom actions
        run: |
          set -eu
          PATTERN='uses:\s*(sigstore/cosign-installer|actions/attest-build-provenance|actions/attest-sbom|anchore/sbom-action)@(?![a-f0-9]{40})'
          if grep -rnPE "${PATTERN}" .github/workflows/; then
            echo "ERROR: sigstore/sbom action(s) above lack a 40-hex SHA pin." >&2
            exit 1
          fi
