name: CI

# TODO(fix-verification-gap): bump actions/checkout from v4.3.1 (Node 20,
# deprecated June 2026) to v6.x (Node 24). Latest tag is v6.0.2 as of
# 2026-05-25. Deferred from this PR because v4→v6 is a major version
# bump (per actions/checkout semver policy) and warrants a dedicated
# verification pass that the new SHA does not change defaults we rely on.

env:
  # Force GitHub Actions runner to execute Node 20 JS actions on Node 24,
  # silencing the deprecation warning ahead of the June 2026 hard cutover.
  # See: actions/checkout v6.0.2 still declares `using: node20` — upgrading
  # the action SHA is tracked separately (see TODO at top of ci.yml).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Phase 9: when set, integration tests that fail to find bitcoind PANIC
  # instead of graceful-skipping. CI sets this; local-dev does not.
  BLINDJOIN_REQUIRE_BITCOIND: "1"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # Phase 9: provision bitcoind v30.2 on the runner so integration tests
      # under tests/integration/* execute end-to-end instead of graceful-skipping.
      # Single source of truth for the version pin is .bitcoind-version at repo
      # root; CI reads it, CONTRIBUTING.md references it, future bumps are a
      # single-line PR. See .planning/phases/09-ci-integration-test-reliability/.
      - name: Read pinned bitcoind version
        id: bitcoind_version
        run: echo "version=$(cat .bitcoind-version)" >> $GITHUB_OUTPUT

      - name: Cache bitcoind binary
        id: cache-bitcoind
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/bin/bitcoind
          # runner.os prefix avoids cache-key collisions across runner OS variants
          # (RESEARCH.md Pitfall 6). The version segment guarantees a cache miss
          # on every .bitcoind-version bump, which re-runs the PGP+SHA256 verify.
          key: ${{ runner.os }}-bitcoind-${{ steps.bitcoind_version.outputs.version }}

      - name: Install bitcoind (cache miss only)
        if: steps.cache-bitcoind.outputs.cache-hit != 'true'
        # Integrity gate (per D-04):
        #   1. Fetch achow101's PGP key from a SHA-pinned guix.sigs commit
        #      (avoids public keyserver flake — RESEARCH.md Pitfall 5).
        #   2. Verify imported key fingerprint matches the KEY_FP value set
        #      below (catches a hostile guix.sigs commit substituting a
        #      different key).
        #   3. gpg-verify SHA256SUMS.asc against SHA256SUMS (signed by achow101).
        #   4. hash-check the tarball against the signed SHA256SUMS entry.
        # KEY_FP is Andrew Chow's (achow101) Bitcoin Core release-signer
        # fingerprint; verified present in the v30.2 attestation directory at
        # bitcoin-core/guix.sigs/30.2/achow101/.
        # guix.sigs commit pinned 2026-05-26 to bitcoin-core/guix.sigs main HEAD.
        run: |
          set -euo pipefail
          VERSION="${{ steps.bitcoind_version.outputs.version }}"
          TARBALL="bitcoin-${VERSION}-x86_64-linux-gnu.tar.gz"
          BASE="https://bitcoincore.org/bin/bitcoin-core-${VERSION}"
          KEY_FP=152812300785C96444D3334D17565732E08E5E41
          GUIX_SIGS_SHA=893b44f5fb1ed2abcdd79feb1c54723e3ccf5b59  # pinned 2026-05-26

          # 1. Fetch achow101's key blob from the pinned guix.sigs commit.
          curl -sL "https://raw.githubusercontent.com/bitcoin-core/guix.sigs/${GUIX_SIGS_SHA}/builder-keys/achow101.gpg" -o /tmp/achow101.gpg
          gpg --import /tmp/achow101.gpg

          # 2. Verify the imported key fingerprint matches expectation.
          gpg --list-keys --with-colons | grep -q "${KEY_FP}" \
            || { echo "ERROR: expected fingerprint ${KEY_FP} not found"; exit 1; }

          # 3. Fetch SHA256SUMS + signature, verify achow101's signature.
          # SHA256SUMS.asc is a multi-signature file — Bitcoin Core releases
          # are signed by ~10 different guix builders. We only import achow101's
          # key and only require achow101's signature to be GOOD. A plain
          # `gpg --verify` would exit non-zero because gpg can't check the
          # other ~9 signatures' keys (which we deliberately don't import —
          # see Trust Model below); under `set -euo pipefail` that would
          # incorrectly fail the script even though achow101's sig is valid.
          #
          # We rely solely on `--status-fd=1`'s machine-readable GOODSIG line
          # and grep for achow101's 16-char long-key-id (last 16 chars of
          # KEY_FP), which positively asserts achow101 signed this exact file
          # — not just "any signer" we happen to trust.
          #
          # Trust model: PR review of bumps to GUIX_SIGS_SHA / KEY_FP is the
          # remaining trust root. An attacker who controls a future guix.sigs
          # HEAD could in principle swap BOTH the key blob AND the KEY_FP
          # value in the same PR; reviewers must check that the new
          # fingerprint matches an externally-verified achow101 public key.
          ACHOW_LONG_KEY_ID="${KEY_FP: -16}"   # last 16 chars of fingerprint
          curl -sL "${BASE}/SHA256SUMS" -o SHA256SUMS
          curl -sL "${BASE}/SHA256SUMS.asc" -o SHA256SUMS.asc
          gpg --status-fd=1 --verify SHA256SUMS.asc SHA256SUMS 2>/dev/null \
            | grep -q "^\[GNUPG:\] GOODSIG ${ACHOW_LONG_KEY_ID} " \
            || { echo "ERROR: SHA256SUMS.asc does not contain a GOODSIG from achow101 (${ACHOW_LONG_KEY_ID})"; exit 1; }

          # 4. Fetch tarball, verify hash against signed sums.
          curl -sL "${BASE}/${TARBALL}" -o "${TARBALL}"
          grep "  ${TARBALL}$" SHA256SUMS | sha256sum -c

          # 5. Extract and install into ~/.local/bin (cached path).
          tar -xzf "${TARBALL}"
          mkdir -p $HOME/.local/bin
          cp "bitcoin-${VERSION}/bin/bitcoind" $HOME/.local/bin/bitcoind
          chmod +x $HOME/.local/bin/bitcoind

      - name: Export BITCOIND_EXE
        # Runs on both cache hit and cache miss — corepc_node::exe_path() reads
        # BITCOIND_EXE as first precedence (verified at corepc-node-0.12.0
        # node/src/lib.rs:635; RESEARCH.md Assumption A7).
        run: echo "BITCOIND_EXE=$HOME/.local/bin/bitcoind" >> $GITHUB_ENV

      - name: Run tests
        run: cargo test --workspace --all-targets

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Run clippy
        # --all-targets includes integration tests, so future struct/API drift
        # that breaks tests/integration/ surfaces as a CI failure, not silent rot.
        run: cargo clippy --workspace --all-targets -- -D warnings

  coordinator-smoke:
    name: coordinator binary builds
    runs-on: ubuntu-latest
    # Proves the production `coordinator` binary compiles in release mode.
    # The binary currently has no `--help` flag — invoking it without a
    # reachable bitcoind exits non-zero, so a runtime smoke would require
    # standing up bitcoind in CI (deferred to a follow-on phase). The
    # release-mode build catches missing-feature-flag / linker-flag
    # regressions that a debug `cargo test` build would not surface.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Build coordinator (release)
        run: cargo build --release --bin coordinator

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    # Blocks merge: cargo audit exits non-zero on any advisory not listed in
    # .cargo/audit.toml. Each ignore in audit.toml carries a written rationale.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run audit
        run: cargo audit
