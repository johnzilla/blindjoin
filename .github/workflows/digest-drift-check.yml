name: Digest drift check

# On-demand check that docker/digests.txt matches upstream registry digests.
# Run before bumping the manifest or any time you want to know if base images
# have moved. Exits non-zero on drift; no issue/PR is opened.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Read canonical digests
        id: digests
        uses: ./.github/actions/read-base-digests

      - name: Diff canonical vs upstream
        env:
          DEBIAN_REF:     ${{ steps.digests.outputs.debian_ref }}
          CARGO_CHEF_REF: ${{ steps.digests.outputs.cargo_chef_ref }}
        run: |
          set -euo pipefail
          drift=0
          check_one() {
            local CANONICAL_REF="$1"
            local IMAGE_TAG="${CANONICAL_REF%@*}"
            local CANONICAL_DIGEST="${CANONICAL_REF#*@}"
            local UPSTREAM_DIGEST
            UPSTREAM_DIGEST=$(docker buildx imagetools inspect "${IMAGE_TAG}" --format '{{.Manifest.Digest}}')
            if [ "${UPSTREAM_DIGEST}" = "${CANONICAL_DIGEST}" ]; then
              echo "OK ${IMAGE_TAG}: ${CANONICAL_DIGEST}"
            else
              echo "DRIFT ${IMAGE_TAG}: canonical=${CANONICAL_DIGEST} upstream=${UPSTREAM_DIGEST}"
              drift=1
            fi
          }
          check_one "${DEBIAN_REF}"
          check_one "${CARGO_CHEF_REF}"
          exit $drift
