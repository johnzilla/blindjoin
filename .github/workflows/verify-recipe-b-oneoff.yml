name: Verify Recipe B (one-off)

# Runs Recipe B from docs/REPRODUCIBLE-BUILD.md inside a fresh ubuntu:24.04
# Docker container on the GHA runner. Prints the rebuilt sha256 so we can
# compare against the native (Recipe A) sha256 baked in REPRODUCIBLE-BUILD.md
# and EXPECTED_SHA256 in reproducible-verify.yml. Delete after first run if
# the result is informative enough to record inline.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recipe-b:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          ref: v1.6.0
          fetch-depth: 0

      - name: Run Recipe B inside docker ubuntu:24.04
        run: |
          docker run --rm -v "$(pwd)":/work -w /work ubuntu:24.04 bash -euxc '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq curl git build-essential pkg-config libssl-dev ca-certificates
            git config --global --add safe.directory /work
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain none --profile minimal
            . "$HOME/.cargo/env"

            export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct HEAD)
            export RUSTFLAGS="--remap-path-prefix=/work=/build --remap-path-prefix=$HOME/.cargo=/cargo"
            export CARGO_INCREMENTAL=0

            cargo build --release --locked --bin coordinator --bin client --bin liquidity-bot

            mkdir -p dist
            cp target/release/coordinator target/release/client target/release/liquidity-bot dist/
            tar --sort=name --owner=0 --group=0 --numeric-owner \
                --mtime="@${SOURCE_DATE_EPOCH}" \
                -cf - -C dist . \
              | gzip -n > blindjoin-linux-amd64.tar.gz

            echo "==RECIPE-B-SHA256=="
            sha256sum blindjoin-linux-amd64.tar.gz
            echo "==END=="
          '
