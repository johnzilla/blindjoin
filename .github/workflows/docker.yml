name: Docker

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  BLINDJOIN_REQUIRE_BITCOIND: "1"

on:
  push:
    tags: ['v*']
  # workflow_dispatch rehearses the check job without pushing images.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check (test + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: "1.95.0"
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install pinned bitcoind
        uses: ./.github/actions/install-bitcoind
      - name: Run tests
        run: cargo test --workspace --all-targets
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run audit
        run: cargo audit

  docker:
    name: Docker ${{ matrix.image }}
    needs: check
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write       # push image + sig + attestation to ghcr.io
      id-token: write       # OIDC for cosign Fulcio cert exchange
      attestations: write   # actions/attest-* writes to the attestations API
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: coordinator
            target: coordinator
          - image: client
            target: client
          - image: liquidity-bot
            target: liquidity-bot

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      # type=semver requires 3-part tags (vX.Y.Z). Two-part tags produce zero image
      # tags and fail the push step. Always tag vMAJOR.MINOR.PATCH.
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/blindjoin-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        id: build
        with:
          context: .
          file: docker/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # cosign-installer pinned at v3.10.1 (last v3.x) to keep the operator-facing
      # cosign 2.x verify range valid. v4.x mandates cosign 3.x.
      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5  # v3.10.1
        with:
          cosign-release: 'v2.6.3'

      # cosign sign produces ghcr.io/.../blindjoin-<image>@sha256-<HEX>.sig
      # (legacy tag convention). attest-build-provenance below produces a separate
      # referrer-manifest artifact — both are required, they're not interchangeable.
      - name: Sign image with cosign
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/blindjoin-${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # Syft generates the SBOM file. attest-sbom (next step) signs and pushes it
      # as an attestation; it does NOT generate SBOMs itself, so this step is a
      # hard prerequisite — do not reorder.
      - name: Generate SPDX SBOM with Syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          image: ghcr.io/${{ github.repository_owner }}/blindjoin-${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # attest-sbom v2.4.0 is the last self-contained release; v3.x/v4.x are
      # deprecation wrappers around actions/attest.
      - name: Attest SBOM
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b  # v2.4.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/blindjoin-${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: 'sbom.spdx.json'
          push-to-registry: true

      # attest-build-provenance v3.2.0 is the last self-contained release; v4.x is
      # a deprecation wrapper around actions/attest.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f  # v3.2.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/blindjoin-${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
