name: Release

env:
  # Silence the Node 20 deprecation warning until we bump actions/checkout to v6.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Make integration tests fail (not skip) when bitcoind is missing — release builds
  # must run the full integration suite.
  BLINDJOIN_REQUIRE_BITCOIND: "1"

on:
  push:
    tags: ['v*']
  # workflow_dispatch rehearses the check job (release-smoke gate) without cutting
  # a tag. The build job below is gated on refs/tags/* so dispatch runs check only.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Check (test + clippy + audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: "1.95.0"
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install pinned bitcoind
        uses: ./.github/actions/install-bitcoind
      - name: Run tests
        run: cargo test --workspace --all-targets
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run audit
        run: cargo audit

  build:
    name: Build linux-amd64
    needs: check
    # Pinned runner image (not the rolling alias) so reproducible-verify.yml on
    # the same pin doesn't false-positive on runner-image rotation.
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write       # softprops uploads to the Releases API
      id-token: write       # OIDC for cosign Fulcio cert exchange
      attestations: write   # actions/attest-build-provenance writes to the attestations API

    # Determinism env. SOURCE_DATE_EPOCH is computed at a step below (from the
    # tagged commit time) — not declared here because YAML-parse is too early.
    env:
      RUSTFLAGS: "--remap-path-prefix=${{ github.workspace }}=/build --remap-path-prefix=/home/runner/.cargo=/cargo"
      CARGO_INCREMENTAL: "0"

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: "1.95.0"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # Reads docker/digests.txt; exits 1 if missing or malformed.
      - name: Read canonical base-image digests
        id: digests
        uses: ./.github/actions/read-base-digests

      # SOURCE_DATE_EPOCH = the tagged commit's committer time. $GITHUB_SHA on a
      # tag-push IS the tag SHA, so external rebuilders can re-derive this with
      # `git log -1 --format=%ct v1.6.0` on a fresh clone.
      - name: Compute SOURCE_DATE_EPOCH
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct $GITHUB_SHA)" >> $GITHUB_ENV

      # --locked fails the run on a stale Cargo.lock instead of silently regenerating.
      - name: Build coordinator and client
        run: cargo build --release --locked --bin coordinator --bin client --bin liquidity-bot

      # Deterministic tar+gzip. The five tar flags + `gzip -n` (which strips the
      # original filename and mtime from the gzip header) are all load-bearing
      # for byte-equality.
      - name: Package (deterministic tar + gzip)
        run: |
          mkdir -p dist
          cp target/release/coordinator dist/
          cp target/release/client dist/
          cp target/release/liquidity-bot dist/
          tar --sort=name --owner=0 --group=0 --numeric-owner \
              --mtime="@${SOURCE_DATE_EPOCH}" \
              -cf - -C dist . \
            | gzip -n > blindjoin-linux-amd64.tar.gz
          sha256sum blindjoin-linux-amd64.tar.gz > blindjoin-linux-amd64.tar.gz.sha256

      # cosign-installer v3.10.1 is the last v3.x; v4.x mandates cosign 3.x which
      # breaks the documented cosign >= 2.6.3, < 3.0.0 verify range. Hold on v3.x
      # until the docs and operator instructions are migrated.
      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5  # v3.10.1
        with:
          cosign-release: 'v2.6.3'

      # Keyless OIDC blob signing → blindjoin-linux-amd64.tar.gz.bundle
      # (sig + cert + Rekor inclusion proof in one JSON).
      - name: Sign tarball with cosign
        run: cosign sign-blob --yes --bundle blindjoin-linux-amd64.tar.gz.bundle blindjoin-linux-amd64.tar.gz

      # SLSA v1.0 build provenance. The action's bundle-path output points at a
      # tempfile; we rename it to .sigstore so softprops can upload it as an
      # operator-discoverable asset.
      - name: Attest tarball build provenance
        id: provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f  # v3.2.0
        with:
          subject-path: blindjoin-linux-amd64.tar.gz

      - name: Rename provenance bundle to .sigstore
        run: mv "${{ steps.provenance.outputs.bundle-path }}" blindjoin-linux-amd64.tar.gz.sigstore

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          files: |
            blindjoin-linux-amd64.tar.gz
            blindjoin-linux-amd64.tar.gz.sha256
            blindjoin-linux-amd64.tar.gz.bundle
            blindjoin-linux-amd64.tar.gz.sigstore
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
