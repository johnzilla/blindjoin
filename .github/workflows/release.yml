name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  check:
    name: Check (test + clippy + audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Run tests
        run: cargo test --workspace
      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run audit (deny high and critical)
        run: cargo audit --deny high --deny critical

  build:
    name: Build ${{ matrix.target }}
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: blindjoin-linux-amd64.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: blindjoin-linux-arm64.tar.gz
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: blindjoin-macos-amd64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: blindjoin-macos-arm64.tar.gz

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross (ARM64 Linux)
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }} --bin coordinator --bin client --bin liquidity-bot

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} --bin coordinator --bin client --bin liquidity-bot

      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/coordinator dist/
          cp target/${{ matrix.target }}/release/client dist/
          cp target/${{ matrix.target }}/release/liquidity-bot dist/
          tar czf ${{ matrix.archive }} -C dist .
          sha256sum ${{ matrix.archive }} > ${{ matrix.archive }}.sha256 || shasum -a 256 ${{ matrix.archive }} > ${{ matrix.archive }}.sha256

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          files: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
