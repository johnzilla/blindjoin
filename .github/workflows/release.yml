name: Release

env:
  # Force GitHub Actions runner to execute Node 20 JS actions on Node 24,
  # silencing the deprecation warning ahead of the June 2026 hard cutover.
  # See: actions/checkout v6.0.2 still declares `using: node20` — upgrading
  # the action SHA is tracked separately (see TODO at top of ci.yml).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Release-smoke gate (P0-5, v1.5 release-readiness): integration tests
  # under tests/integration/* must FAIL on bitcoind-missing rather than
  # graceful-skip during a release. The composite install-bitcoind action
  # provisions the pinned bitcoind in <90s on cache miss and ~0s on cache
  # hit; the trade-off is small relative to release confidence.
  BLINDJOIN_REQUIRE_BITCOIND: "1"

on:
  push:
    tags: ['v*']
  # workflow_dispatch enables rehearsal of the check job (release-smoke
  # gate under BLINDJOIN_REQUIRE_BITCOIND=1 via the composite
  # install-bitcoind action) without cutting a tag or publishing
  # artifacts. Trigger from the Actions tab on any branch; the `build`
  # job below is gated on `refs/tags/*` so a dispatch run runs check
  # only and stops short of uploading to GitHub Releases. See
  # .planning/quick/260531-ubf-*/SUMMARY.md for the rehearsal procedure.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Check (test + clippy + audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # Composite source-of-truth — see .github/actions/install-bitcoind/action.yml.
      # Same PGP+SHA256 integrity gate as ci.yml. The release pipeline runs
      # the full --all-targets suite (not --lib) so a tag push cannot ship
      # binaries unless every integration test under tests/integration/*
      # has executed against the pinned bitcoind. Trade-off: ~30s on cache
      # hit, ~90s on cache miss (the first job after a .bitcoind-version
      # bump). Acceptable cost for release-grade confidence.
      - name: Install pinned bitcoind
        uses: ./.github/actions/install-bitcoind
      - name: Run tests (workspace, all targets — integration suite included)
        run: cargo test --workspace --all-targets
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run audit
        run: cargo audit

  build:
    name: Build linux-amd64
    needs: check
    runs-on: ubuntu-latest
    # Publish gate: only run on a real tag push. workflow_dispatch runs
    # check-only (the rehearsal path) and never uploads release artifacts.
    if: startsWith(github.ref, 'refs/tags/')
    # Phase 24 SIGN-01/SIGN-02: cosign keyless signing + actions/attest-build-provenance need:
    #   - contents:     write — softprops/action-gh-release uploads Release assets. Without
    #                   this, softprops fails with 403 Forbidden on the Releases API call.
    #                   See Phase 24 D-02.
    #   - id-token:     write — OIDC token for Fulcio cert exchange. Without this,
    #                   cosign sign-blob fails with the opaque "fulcio: 400 Bad
    #                   Request" error. See PITFALLS Pitfall 2 + Phase 23 D-02.
    #   - attestations: write — persist the SLSA provenance attestation to GitHub's
    #                   attestations API. Without this, actions/attest-build-provenance
    #                   fails with 403 Forbidden on the API call. See Phase 23
    #                   RESEARCH §2.1 + the matching docker.yml block at lines 67-70.
    # Deliberately omitted (auditor-grepable per Plan 22-04): packages, PR-write,
    # pages, issues, deployments. These tokens MUST NOT appear anywhere in this file.
    # release.yml does NOT push to ghcr.io — the absence of a literal `packages:` token
    # at any indentation is the file-level audit gate confirming the no-ghcr-push contract.
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # Phase 22 DRIFT-03: read the canonical base-image digest manifest.
      # This step is a supply-chain gate — a tag push cannot publish a
      # release tarball unless docker/digests.txt is present and well-formed
      # (the composite action exits 1 otherwise; see
      # .github/actions/read-base-digests/action.yml). Outputs are unused by
      # the cargo build directly but exported for downstream phases
      # (Phase 25 reproducibility recipe) and for log-audit observability.
      - name: Read canonical base-image digests
        id: digests
        uses: ./.github/actions/read-base-digests

      - name: Build coordinator and client
        run: cargo build --release --bin coordinator --bin client --bin liquidity-bot

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/coordinator dist/
          cp target/release/client dist/
          cp target/release/liquidity-bot dist/
          tar czf blindjoin-linux-amd64.tar.gz -C dist .
          sha256sum blindjoin-linux-amd64.tar.gz > blindjoin-linux-amd64.tar.gz.sha256

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          files: |
            blindjoin-linux-amd64.tar.gz
            blindjoin-linux-amd64.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
