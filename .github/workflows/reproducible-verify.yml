name: Reproducible build verifier

# On-demand re-verification that the latest blindjoin-linux-amd64.tar.gz Release
# tarball is byte-equal across rebuilds on the pinned ubuntu-24.04 runner image.
# Re-verifies the cosign signature, rebuilds from the tagged source via the
# REPRO-01 recipe, and compares sha256. Fires on workflow_dispatch only — run it
# when cutting a release or when you want a fresh re-prove.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Expected sha256 of blindjoin-linux-amd64.tar.gz for the latest tagged release.
  # Update at every release. Replace <TBD-v1.6.0-cut> with the real value after
  # the first workflow_dispatch run on the v1.6.0 tag.
  EXPECTED_SHA256: "<TBD-v1.6.0-cut>"

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve latest release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(gh release view --json tagName --jq .tagName)
          [[ -n "$LATEST_TAG" ]] || { echo "No releases found"; exit 1; }
          echo "LATEST_TAG=${LATEST_TAG}" >> $GITHUB_ENV

      - name: Download release tarball + cosign bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/rel
          gh release download "${LATEST_TAG}" --pattern 'blindjoin-linux-amd64.tar.gz*' --dir /tmp/rel

      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5  # v3.10.1
        with:
          cosign-release: 'v2.6.3'

      - name: Re-verify cosign signature
        run: |
          cd /tmp/rel
          cosign verify-blob \
            --bundle blindjoin-linux-amd64.tar.gz.bundle \
            --certificate-identity-regexp 'https://github.com/${{ github.repository_owner }}/blindjoin/\.github/workflows/release\.yml@refs/tags/v.*' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            blindjoin-linux-amd64.tar.gz

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          ref: ${{ env.LATEST_TAG }}

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9  # stable
        with:
          toolchain: "1.95.0"

      - name: Rebuild and compare sha256
        env:
          RUSTFLAGS: "--remap-path-prefix=${{ github.workspace }}=/build --remap-path-prefix=/home/runner/.cargo=/cargo"
          CARGO_INCREMENTAL: "0"
        run: |
          set -euo pipefail
          # HEAD (not $GITHUB_SHA) — after checkout of the tag, HEAD is the tag commit.
          # $GITHUB_SHA on workflow_dispatch is the trigger commit, not the tag.
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct HEAD)
          cargo build --release --locked --bin coordinator --bin client --bin liquidity-bot
          mkdir -p dist
          cp target/release/coordinator target/release/client target/release/liquidity-bot dist/
          tar --sort=name --owner=0 --group=0 --numeric-owner \
              --mtime="@${SOURCE_DATE_EPOCH}" \
              -cf - -C dist . \
            | gzip -n > blindjoin-linux-amd64.tar.gz

          DOWNLOADED=$(sha256sum /tmp/rel/blindjoin-linux-amd64.tar.gz | cut -d' ' -f1)
          REBUILT=$(sha256sum blindjoin-linux-amd64.tar.gz | cut -d' ' -f1)
          echo "Downloaded release: ${DOWNLOADED}"
          echo "Rebuilt locally:    ${REBUILT}"
          echo "Expected (env):     ${EXPECTED_SHA256}"
          if [ "${DOWNLOADED}" != "${REBUILT}" ]; then
            echo "MISMATCH: rebuilt tarball does not match downloaded release for ${LATEST_TAG}"
            exit 1
          fi
          if [ "${EXPECTED_SHA256}" != "<TBD-v1.6.0-cut>" ] && [ "${REBUILT}" != "${EXPECTED_SHA256}" ]; then
            echo "MISMATCH: rebuilt tarball does not match EXPECTED_SHA256 env"
            exit 1
          fi
          echo "OK: ${LATEST_TAG} reproduces byte-for-byte"
