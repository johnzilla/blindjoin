# Pin the exact Rust stable toolchain for local dev and CI. Single source of
# truth for the version; when bumping, keep the `with: toolchain:` values in
# .github/workflows/{ci,release,docker,audit-cron}.yml in sync with the channel
# below by hand (there is no automated pin-check job).
#
# Verified 2026-06-02: rustc 1.95.0 (59807616e 2026-04-14).
[toolchain]
channel = "1.95.0"
profile = "minimal"
components = ["rustfmt", "clippy"]
