# cargo-audit configuration for blindjoin.
#
# This file lists advisories that are intentionally accepted as residual risk.
# Each entry below must include a written rationale. Adding an ignore without
# a documented reason is a code-review-blocking change.
#
# Reviewed: 2026-11-26 (arti-upgrade investigation: confirmed neither residual
# below is closeable by an arti version bump — both are pinned by arti's own
# upstream deps, and no current arti release, 0.48 latest, moves either; see
# each entry). Prior: 2026-11-25 (post-v1.8.1 advisory-DB catch-up; the RustSec
# DB surfaced a batch of 2026 advisories across the transitive tree. 23 were
# cleared by surgical lockfile bumps that leave rsa/blind-rsa-signatures
# pinned; the two below are reachable only through arti-client 0.41). Prior:
# 2026-06-01 (v1.5 release-readiness re-review; bumped from 2026-05-31 Phase 21
# AUDIT-02 set as part of the v1.5 ship gate).

[advisories]
ignore = [
    # rsa crate (transitive via blind-rsa-signatures) — Marvin Attack timing
    # sidechannel. No upstream fix available.
    #
    # Why accepted as residual risk in blindjoin:
    # The Marvin Attack model assumes the attacker can submit many chosen
    # ciphertexts against the same long-lived private key and measure
    # decryption timing precisely. blindjoin's structural countermeasures:
    # (i) per-round ephemeral RSA-2048 keypair (D-02); (ii) bounded
    # blind-sign operations per round (default max_participants = 20);
    # (iii) AUDIT-03 RoundSecretKey + Option<RsaBlindSigner> bounded
    # lifetime on RoundStateInner — the secret is dropped at the SOLE
    # FSM chokepoint transition_to(Phase::Idle) (declared at coordinator/
    # src/round/state.rs:193; the self.inner = None assignment lives at
    # state.rs:202 inside the validated-transition block 201-207),
    # triggering the transitive <rsa::RsaPrivateKey
    # as Drop>::drop chain at rsa-0.9.10/src/key.rs:76-82 which zeroizes
    # d, primes, and precomputed unconditionally. The structural lifetime
    # bound is verified by coordinator/src/round/state.rs::tests::
    # round_secret_key_dropped_on_round_end. The Marvin Attack's
    # preconditions (long-lived key + unlimited measurements) do not
    # obtain in this codebase.
    #
    # This residual-risk acceptance is explicitly in scope for the planned
    # external security audit. If the audit finds the ephemeral-key mitigation
    # insufficient (e.g. cross-round timing oracles via shared TLS state),
    # this entry will be removed and a remediation plan published.
    # See docs/AUDIT-CHARTER.md#rsa-secret-key-zeroization-window for the full rationale.
    "RUSTSEC-2023-0071",

    # bincode 2.0.1 — marked unmaintained.
    #
    # Transitive dependency (not directly used by blindjoin). Will track
    # upstream for a maintained replacement. Not a runtime vulnerability.
    # See docs/AUDIT-CHARTER.md#residual-risks-cargo-audit-advisories for the full rationale.
    "RUSTSEC-2025-0141",

    # paste 1.0.15 — proc-macro crate marked unmaintained.
    #
    # Compile-time-only macro. No runtime code path. Transitive dep.
    # See docs/AUDIT-CHARTER.md#residual-risks-cargo-audit-advisories for the full rationale.
    "RUSTSEC-2024-0436",

    # crypto-bigint 0.5.5 — timing variability in constant-time ops.
    #
    # Reached ONLY transitively through arti-client 0.41's NIST-curve TLS
    # stack: p256/p384/p521/ecdsa -> elliptic-curve 0.13 -> crypto-bigint
    # 0.5.5. blindjoin's own cryptography is RSA blind signatures
    # (blind-rsa-signatures, which stays on rsa 0.9.x) and secp256k1 (via
    # rust-bitcoin); neither uses crypto-bigint. The advisory concerns
    # constant-time bigint math inside Tor's TLS handshake, not any
    # blindjoin code path. Our own crypto-bigint 0.7.x edge is already
    # bumped to >=0.7.6; only arti's 0.5.5 copy remains. An arti version bump
    # does NOT move it: the 0.5.5 copy is pinned by arti's own upstream
    # dependency ssh-key-fork-arti (RustCrypto 0.13 line), and no current arti
    # release (0.48 is latest, verified 2026-11-26) advances it. Closure awaits
    # upstream arti moving off the RustCrypto 0.13 stack; accepted until then.
    # See docs/AUDIT-CHARTER.md#residual-risks-cargo-audit-advisories for the full rationale.
    "RUSTSEC-2026-0387",

    # libsqlite3-sys 0.36.0 — C SQLite CVE-2026-119375.
    #
    # Reached ONLY transitively through arti-client 0.41 -> tor-dirmgr ->
    # rusqlite 0.38 -> libsqlite3-sys 0.36. This SQLite instance is arti's
    # on-disk directory cache (consensus + descriptor storage), populated
    # from the Tor directory system over arti's own authenticated channels.
    # It is NOT exposed to CoinJoin participants or any blindjoin protocol
    # input; the coordinator and client present no SQL surface to untrusted
    # peers. The fix (libsqlite3-sys >=0.39.0) requires rusqlite >=0.43, but
    # arti's tor-dirmgr caps rusqlite below 0.41, so no current arti release
    # pulls a patched libsqlite3-sys (0.48, latest as of 2026-11-26, only
    # reaches 0.38.2 — still <0.39). Closure awaits upstream arti raising that
    # cap; accepted until then.
    # See docs/AUDIT-CHARTER.md#residual-risks-cargo-audit-advisories for the full rationale.
    "RUSTSEC-2026-0459",
]
