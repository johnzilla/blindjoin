# cargo-audit configuration for blindjoin.
#
# This file lists advisories that are intentionally accepted as residual risk.
# Each entry below must include a written rationale. Adding an ignore without
# a documented reason is a code-review-blocking change.
#
# Reviewed: 2026-05-26.

[advisories]
ignore = [
    # rsa crate (transitive via blind-rsa-signatures) — Marvin Attack timing
    # sidechannel. No upstream fix available.
    #
    # Why accepted as residual risk in blindjoin:
    # The Marvin Attack model assumes the attacker can submit many chosen
    # ciphertexts against the same long-lived private key and measure
    # decryption timing precisely. blindjoin's coordinator generates a fresh
    # ephemeral RSA keypair per round, performs at most `max_participants`
    # blind-sign operations against it (default cap: 20 per round), and
    # destroys the key via `zeroize` after the round broadcasts. The attack
    # model's preconditions (long-lived key, unlimited measurements) do not
    # obtain.
    #
    # This residual-risk acceptance is explicitly in scope for the planned
    # external security audit. If the audit finds the ephemeral-key mitigation
    # insufficient (e.g. cross-round timing oracles via shared TLS state),
    # this entry will be removed and a remediation plan published.
    "RUSTSEC-2023-0071",

    # rand 0.9.x / 0.10.x (transitive via arti-client and blind-rsa-signatures)
    # — unsoundness when a custom logger calls `rand::rng()` during another
    # rand operation.
    #
    # The 0.8.x track was fixed in 0.8.6 (we bumped to that in quick task
    # 260526-d7m). Upstream patches for 0.9.x and 0.10.x have not shipped yet;
    # cargo audit surfaces these as warning-class unsoundness on the residual
    # deps.
    #
    # Why accepted as residual risk in blindjoin:
    # blindjoin uses `tracing` + `tracing-subscriber` for logging. Neither has
    # a custom logger that invokes `rand::rng()` during rand calls. The attack
    # precondition (a custom logger reaching back into rand's reseeding path)
    # is structurally absent from this codebase.
    #
    # Remove this entry once rand publishes a fixed 0.9.x and 0.10.x and the
    # transitive bumps land via blind-rsa-signatures and arti-client.
    "RUSTSEC-2026-0097",

    # bincode 2.0.1 — marked unmaintained.
    #
    # Transitive dependency (not directly used by blindjoin). Will track
    # upstream for a maintained replacement. Not a runtime vulnerability.
    "RUSTSEC-2025-0141",

    # paste 1.0.15 — proc-macro crate marked unmaintained.
    #
    # Compile-time-only macro. No runtime code path. Transitive dep.
    "RUSTSEC-2024-0436",
]
